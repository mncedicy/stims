<script src="/Scripts/Configuration/automations.js"></script>

<div class="col-sm-12">
    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-end">
                <h5 class="mb-0"><b>Automations</b></h5>
                <button type="button" id="btnAddNew" class="btn btn-outline-primary btn-sm d-inline-flex pull-right">New Rule</button>
            </div>

        </div>




        <div class="card-body">
            <div class="dt-responsive">
                <table id="dom-jqry" class="table table-striped table-bordered nowrap">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Trigger</th>
                        <th>Type</th>
                        <th>When</th>
                        <th>Days/Doc</th>
                        <th>Status</th>
                        <th class="text-center clsAction">Action</th>
                    </tr>
                    </thead>
                    <tbody id="tblRule">


                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>



<div class="modal fade modal-animate" id="addRuleModal" data-bs-backdrop="static" data-bs-keyboard="false"
     aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Rule</h5>
                <button type="button" class="btn-close cancelManage" data-bs-dismiss="modal" aria-label="Close"> </button>
            </div>
            <div class="modal-body">


                <div class="m-2">
                    <div class="col-12">
                        <div class="row">

                            <div class="col-md-12 mb-3">
                                <div class="form-floating">
                                    <input type="text" autocomplete="off" id="txtName" class="form-control clsRule" />
                                    <label for="txtName">Rule Name</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <select class="form-control clsRule requiredRule" placeholder="" id="cboTrigger">
                                        <option selected value="">Select</option>
                                        <option value="SMS">SMS</option>
                                        <option value="Whatsapp">Whatsapp</option>
                                        <option value="Status">Status</option>
                                        <option value="Email">Email</option>
                                    </select>
                                    <label for="cboTrigger">Trigger</label>
                                </div>
                            </div>


                            <div class="col-md-6">
                                <div class="mb-3">
                                    <div class="form-floating">
                                        <select class="form-control clsCleanTrigger clsRule" placeholder="" id="cboWhen">
                                            <option selected value="">Select</option>
                                            <option class="Trigger SMS Status Whatsapp" value="After Offence Date">After Offence Date</option>
                                            <option class="Trigger SMS Status Whatsapp" value="Before Court Date">Before Court Date</option>
                                            <option class="Trigger SMS Status Whatsapp" value="After Court Date">After Court Date</option>
                                            <option class="Trigger SMS Status Whatsapp" value="Before Payment Date">Before Payment Date</option>
                                            <option class="Trigger SMS Status Whatsapp" value="After Payment Date">After Payment Date</option>
                                            <option class="Trigger SMS Status Whatsapp" value="After Capture Date">After Capture Date</option>
                                            <option class="Trigger Email" value="Daily">Daily</option>
                                            <option class="Trigger Email" value="Weekly">Weekly</option>
                                            <option class="Trigger Email" value="Monthly">Monthly</option>
                                            <option class="Trigger Email" value="Yearly">Yearly</option>
                                        </select>
                                        <label for="cboWhen">When</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3 Trigger SMS Status Whatsapp">
                                <div class="form-floating">
                                    <input id="txtDaysRepeat" placeholder="" type="number" class="form-control clsRuleChange">
                                    <label for="txtDaysRepeat">Days</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3 Trigger Email cboWhen Daily">
                                <div class="form-floating">
                                    <select class="form-control clsCleanTrigger clsRuleChange" placeholder="" id="cboWeekDays">
                                        <option selected value="">Select</option>
                                        <option value="Weekdays">Weekdays</option>
                                        <option value="Weekends">Weekends</option>
                                        <option value="Holidays">Holidays</option>
                                        <option value="Weekdays Weekends">Weekdays and Weekends</option>
                                        <option value="Weekdays Holidays">Weekdays and Holidays</option>
                                        <option value="Weekends Holidays">Weekends and Holidays</option>
                                        <option value="Weekdays Weekends Holidays">Weekdays, Weekends and Holidays</option>
                                    </select>
                                    <label for="cboWeekDays">Week Days</label>
                                </div>
                            </div>


                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <select class="form-control clsCleanTrigger clsRule" placeholder="" id="cboType">
                                        <option selected value="">Select</option>
                                        <option class="Trigger SMS Whatsapp" value="Payment Reminder">Payment Reminder</option>
                                        <option class="Trigger SMS Whatsapp" value="Notice Issued">Infringement Issued Notification</option>
                                        <option class="Trigger SMS Whatsapp" value="Court Appearance Reminder">Court Appearance Reminder</option>
                                        <option class="Trigger SMS Whatsapp" value="Payment Acknowledgement">Payment Acknowledgement</option>
                                        <option class="Trigger Status" value="Warrant">Warrant</option>
                                        <option class="Trigger Status" value="Expired">Expired</option>
                                        <option class="Trigger Email" value="Infringement">Infringement Report</option>
                                        <option class="Trigger Email" value="Payment">Payment Report</option>
                                    </select>
                                    <label for="cboType">Type</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3 Trigger Email">
                                <div class="form-floating">
                                    <select class="form-control clsCleanTrigger clsRuleChange" placeholder="" id="cboRange">
                                        <option data-val="0" selected value="">Select</option>
                                        <option data-val="1" value="1 Day">1 Day</option>
                                        <option data-val="2" value="2 Days">2 Days</option>
                                        <option data-val="7" value="1 Week">1 Week</option>
                                        <option data-val="14" value="2 Weeks">2 Weeks</option>
                                        <option data-val="30" value="1 Month">1 Month</option>
                                        <option data-val="60" value="2 Months">2 Months</option>
                                        <option data-val="365" value="1 Year">1 Year</option>
                                    </select>
                                    <label for="cboRange">Date Range</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3 Trigger Email">
                                <div class="form-floating">
                                    <select class="form-control clsCleanTrigger clsRuleChange" placeholder="" id="cboDocument">
                                        <option value="">Select</option>
                                        <option value="PDF">PDF</option>
                                        <option value="Excel">Excel</option>
                                    </select>
                                    <label for="cboDocument">Document Type</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3 Trigger Email">
                                <div class="form-floating">
                                    <select class="form-control clsCleanTrigger clsRuleChange" placeholder="" id="cboGrouping">
                                        <option value="">No Grouping</option>
                                        <option class="Type Infringement" value="Traffic Officer">Traffic Officer</option>
                                        <option class="Type Infringement" value="Notice Type">Notice Type</option>
                                        <option class="Type Infringement" value="Charge Code">Charge Code</option>
                                        <option class="Type Infringement" value="Captured By">Captured By</option>
                                        <option class="Type Infringement" value="Offence Date">Offence Date</option>
                                        <option class="Type Infringement" value="Offence Month">Offence Month</option>
                                        <option class="Type Payment" value="Payment Type">Payment Type</option>
                                        <option class="Type Payment" value="Collected By">Collected By</option>
                                        <option class="Type Payment" value="Payment Date">Payment Date</option>
                                        <option class="Type Payment" value="Payment Month">Payment Month</option>
                                    </select>
                                    <label for="cboGrouping">Report Grouping</label>
                                </div>
                            </div>


                            <div class="col-md-6 mb-3 Trigger Email">
                                <div class="form-floating">
                                    <input type="text" autocomplete="off" id="cboStart" class="form-control clsCleanTrigger myDatepicker clsRuleChange" placeholder="Date" />

                                    <label for="cboStart">Start From</label>
                                </div>
                            </div>

                            <div class="col-md-12 mb-3 Trigger SMS Whatsapp" style=" position: relative">
                                <div class="form-floating">

                                    <textarea class="form-control clsRuleChange" id="txtMessage" style="height: 180px" spellcheck="true"></textarea>
                                    <label for="txtMessage">Message template</label>

                                </div>
                                <div  class="variables">

                                    <div class="dropdown">
                                        <a class="avtar avtar-xs btn-link-secondary dropdown-toggle arrow-none show" href="#" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="true"  data-bs-title="Variables">
                                            <i class="ti ti-dots-vertical f-18"></i></a>
                                        <div class="dropdown-menu dropdown-menu-end"  data-popper-placement="bottom-end">
                                            <a class="dropdown-item" data-val="{{Fine}}">Fine</a>
                                            <a class="dropdown-item" data-val="{{OffenceDate}}">Offence Date</a>
                                            <a class="dropdown-item" data-val="{{CourtDate}}">Court Date</a>
                                            <a class="dropdown-item" data-val="{{CourtName}}">Court Name</a>
                                            <a class="dropdown-item" data-val="{{Reference}}">Reference</a>
                                            <a class="dropdown-item" data-val="{{Registration}}">Registration</a>
                                            <a class="dropdown-item" data-val="{{Location}}">Location</a>
                                            <a class="dropdown-item" data-val="{{PaymentDate}}">Payment Date</a>
                                            <a class="dropdown-item" data-val="{{IDNumber}}">ID Number</a>
                                            <a class="dropdown-item" data-val="{{InvoiceNumber}}">Invoice Number</a>
                                            <a class="dropdown-item" data-val="{{Charge}}">Charge</a>
                                            <a class="dropdown-item" data-val="{{OffenderName}}">Offender Name</a>
                                            <a class="dropdown-item" data-val="{{ClientName}}">Client Name</a>
                                            <a class="dropdown-item" data-val="{{PaymentLink}}">Payment Link</a>

                                        </div>
                                    </div>








                                </div>
                            </div>

                        </div>
                    </div>

                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-link-danger cancelManage" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="btnSubmitRule" class="btn btn-primary shadow-2">Save</button>
            </div>
        </div>
    </div>
</div>
