<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Payment Receipt</title>
	<style>
		.invoice-box {
			max-width: 800px;
			margin: auto;
			padding: 30px;
			border: 1px solid #eee;
			font-size: 16px;
			line-height: 24px;
			font-family: 'Helvetica Neue', 'Helvetica', Helvetica, Arial, sans-serif;
			color: #555;
		}

		.invoice-box table {
			width: 100%;
			line-height: inherit;
			text-align: left;
		}

		.invoice-box table td {
			padding: 5px;
			vertical-align: top;
		}

		.invoice-box table tr td:nth-child(4) {
			text-align: right;
		}

		.invoice-box table tr.top table td {
			padding-bottom: 20px;
		}

		.invoice-box table tr.top table td.title {
			font-size: 45px;
			line-height: 45px;
			color: #333;
		}

		.invoice-box table tr.information table td {
			padding-bottom: 40px;
		}

		.invoice-box table tr.heading td {
			background: #eee;
			border-bottom: 1px solid #ddd;
			font-weight: bold;
		}

		.invoice-box table tr.details td {
			padding-bottom: 20px;
		}

		.invoice-box table tr.item td {
			border-bottom: 1px solid #eee;
		}

		.invoice-box table tr.item.last td {
			border-bottom: none;
		}

		.invoice-box table tr.total td:nth-child(4) {
			border-top: 2px solid #eee;
			font-weight: bold;
			text-align: right;
			margin-top:20px;
		}

.invoice-box table tr td.right {
			text-align: right;
		}
		@media only screen and (max-width: 600px) {
			.invoice-box table tr.top table td {
				width: 100%;
				display: block;
				text-align: center;
			}

			.invoice-box table tr.information table td {
				width: 100%;
				display: block;
				text-align: center;
			}
		}

		/** RTL **/
		.invoice-box.rtl {
			direction: rtl;
			font-family: Tahoma, 'Helvetica Neue', 'Helvetica', Helvetica, Arial, sans-serif;
		}

		.invoice-box.rtl table {
			text-align: right;
		}

		.invoice-box.rtl table tr td:nth-child(4) {
			text-align: left;
		}
	</style>
</head>

<body>








	<div class="invoice-box" >
		<h3 style="text-align: center;border-bottom: 1px dashed silver; padding-bottom: 30px;"> Payment Receipt </h3>
		<!--suppress HtmlDeprecatedAttribute -->
		<table cellpadding="0" cellspacing="0">


			<tr class="top information">
				<td colspan="4">
					<table>
						<tr>
							<td>
								<span data-th-text="${'Invoice #: ' +invoice_number}"></span><br />
								<span data-th-text="${invoice_name_from}"></span><br />
								<span data-th-text="${'R'+invoice_amount}"></span>
							</td>
							<td></td>

							<td class="right">
								<span data-th-text="${'Date: ' +#temporals.format(invoice_payment_date, 'MMM dd, yyyy') }"></span> <br />
								<span data-th-text="${invoice_name_to}"></span> <br />
								<span data-th-text="${invoice_payment_type}"></span> <br />
							</td>
						</tr>
					</table>
				</td>
			</tr>

			<tr class="heading">
				<td>#</td>
				<td>Reference</td>
				<td>Registration</td>
				<td>Amount</td>
			</tr>

			<tr data-th-each="invoice_item, iteration : ${invoice_items}" class="item last">
				<td data-th-text="${iteration.index + 1}"></td>
				<td data-th-text="${invoice_item.invoice_item_reference}"></td>
				<td data-th-text="${invoice_item.invoice_item_registration}"></td>
				<td data-th-text="${'R'+invoice_item.invoice_item_amount}"></td>

			</tr>

			<tr class="total">
				<td></td><td></td><td></td>

				<td data-th-text="${'Total: R'+invoice_amount}" ></td>
			</tr>
		</table>

	</div>

</body>

</html>
