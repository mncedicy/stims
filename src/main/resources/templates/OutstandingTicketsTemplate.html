<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Title</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
</head>
<style>
  .bold{font-weight: bold;}
  .bolder{font-weight: 600;}
    .card{border-radius: 0px;}
  .muted{color:#d4d4d4 !important}
  .b-gray{background: #f3f3f3 !important}
</style>
<body >

<div class="col-md-12">
  <h5 class="row text-center bold">Outstanding Tickets</h5>
  <div class="card pb-1" style="font-size: 13px;">
    <div class="card-body  mb-0 pb-0 f-10">
      <ul class="list-group list-group-flush mb-0 pb-0 pb-0 pt-0">
        <li class="list-group-item px-0 pt-0 pb-0  mb-0 pb-0 pb-0 pt-0">
          <div class="row mb-0 pb-0 pb-0 pt-0">
            <div class="col-md-6  mb-0 pb-0 pr-0"  style="width:120%" >
              <b class="mb-1 bold">Name</b>
              <p class="mb-2" data-th-text="${name}"></p>
              <p class="mb-1">
                <b class="bold">Outstanding Amount: </b>
                <b data-th-text="${'R '+total}"></b>
              </p>
              <p>
                <b class="bold">Outstanding Warrants: </b>
                <b data-th-text="${'R '+totalWarrant}"></b>
              </p>
            </div>
            <div class="col-md-6  mb-0 pb-0 pr-0"  style="width:120%" >
              <b class="mb-1 bold">ID Number</b>
              <p class="mb-2" data-th-text="${id_number}"></p>
              <p class="mb-1">
                <b class="bold">Outstanding Tickets: </b>
                <b data-th-text="${count}"></b>
              </p>
              <p>
                <b class="bold">Total Warrants: </b>
                <b data-th-text="${countWarrant}"></b>
              </p>


            </div>

          </div>
        </li>
      </ul>
    </div>
  </div>



</div>

<div data-th-each="notice, iteration : ${noticeList}" class="item last p-3 pb-2">
  <p class="m-0 p-1 bold b-gray" data-th-text="${registrations.get(iteration.index)}"></p>
  <div data-th-each="item, iterationItem : ${notice}" class="item last p-1 pt-0 pb-0 pl-3 row mb-0" style="font-size: 13px;">
    <div class="col-md-3 mb-0">
      <p class="mb-0" data-th-text="${item.infringement_notice_reference}"></p>
    </div>
    <div class="col-md-3 mb-0">
      <p class="mb-0" data-th-text="${#temporals.format(item.infringement_notice_offence_date, 'MMMM dd, yyyy')}"></p>
    </div>
    <div class="col-md-3 mb-0">
      <p class="mb-0" data-th-text="${item.infringement_notice_final_amount}<1?'NAG':'R'+${item.infringement_notice_final_amount}"></p>
    </div>
    <div class="col-md-3 mb-0">
      <p class="mb-0" data-th-text="${item.infringement_notice_status}"></p>
    </div>


  </div>

</div>




</body>
</html>
