<script src="/Scripts/Printing/courtRoll.js"></script>


<div class="col-sm-12">
    <div class="card">
        <div class="card-header">

            <div class="d-flex justify-content-between align-items-end">
                <h5 class="mb-2"><b>Court Register</b></h5>
                <a class="btn btn-outline-primary btn-sm" id="btnNewRoll">Create Court Roll</a>

            </div>

        </div>


        <div class="card-body">


            <div id="calendar" class="mb-3">

            </div>

            <div class="dt-responsive">
                <table id="" class="table table-xs nowrap table-hover">
                    <thead>
                    <tr class="border-bottom">
                        <th>ID</th>
                        <th>Court Name</th>
                        <th>Court Date</th>
                        <th>Notice Type</th>
                        <th>Records</th>
                        <th>Captured</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody id="listRolls"></tbody>

                </table>
            </div>
        </div>


    </div>
</div>








<div class="modal fade modal-animate" id="newRollModal" data-bs-backdrop="static" data-bs-keyboard="false"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Court Roll</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
            </div>
            <div class="modal-body">


                <div class="m-2">
                    <div class="col-12">
                        <div class="d-flex justify-content-center row">


                            <div class="col-md-12 mb-3">
                                <div class="form-floating p-r-20">
                                    <select class="form-control  requiredRoll" placeholder="" id="cboNoticeType">
                                        <option data-notice="999999" value="10">341 Hand Written</option>
                                        <option data-notice="999999" selected value="50">Section 56</option>
                                        <option data-notice="9999" value="51">Section 56 By-law</option>
                                    </select>
                                    <label for="cboNoticeType">Notice Type</label>
                                </div>
                            </div>
                            <div class="col-md12 mb-3">
                                <div class="form-floating p-r-20">
                                    <select class="form-control requiredRoll" placeholder="" id="cboCourtNameIndex">
                                        <option disabled="disabled" selected value="">Select</option>
                                    </select>
                                    <label for="cboCourtNameIndex">Court Name</label>
                                </div>
                            </div>
<!--                            <div class="col-md12 mb-3">-->
<!--                            <div class="form-floating p-r-15">-->
<!--                                <input maxlength="10" type="text" autocomplete="off" class="form-control myDatepicker requiredRoll" id="txtCourtDate">-->
<!--                                <label for="txtCourtDate">Court Date</label>-->
<!--                            </div>-->
<!--                        </div>-->


                        </div>
                    </div>

                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-link-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-outline-primary shadow-2" id="btnPrint">Create</button>
            </div>
        </div>
    </div>
</div>







<div class="modal fade modal-animate" id="courtResultsModal" data-bs-backdrop="static" data-bs-keyboard="false"
     aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Court Roll ID: <small class="clsRollId text-muted"></small> - <small class="clsRollStatus"></small></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
            </div>
            <div class="modal-body">


                <div class="m-2 row">
                    <div class="col-md-8">
                        <div class="card" style="height:380px;">
                            <div class="card-body p-0">
                                <div class="dt-responsive">
                                    <table id="tblNotice" class="table table-xs nowrap table-hover">
                                        <thead>
                                        <tr class="border-bottom">
                                            <th>Case Number</th>
                                            <th>Notice Reference</th>
                                            <th>Fine Amount</th>
                                            <th>Court Feedback</th>
                                            <th>Status</th>
                                        </tr>
                                        </thead>
                                        <tbody id="listRollItems"></tbody>

                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card" style="height: 380px;">
                            <div class="card-header d-flex justify-content-between align-items-end">
                                <h5 class="mb-1">Case: <span class="clsCaseNumber text-muted">0000</span></h5>
                                <a class="btn btn-outline-primary btn-sm" id="btnNext">Next</a>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-center row">


                                    <div class="col-md-12 mb-3">
                                        <div class="form-floating">
                                            <select class="form-control txtFeedback requiredFeedback" placeholder="" id="cboFeedback">
                                                <option value="" disabled></option>
                                                <option value="Warrant issued immediately">Warrant issued immediately</option>
                                                <option value="Removed from court roll">Removed from court roll</option>
                                                <option value="Admission of guilt paid">Admission of guilt paid</option>
                                                <option value="Withdrawn by prosecutor">Withdrawn by prosecutor</option>
                                                <option value="Postponed: Accuse warned">Postponed: Accuse warned</option>
                                                <option value="Reduced by prosecutor">Reduced by prosecutor</option>
                                            </select>
                                            <label for="cboFeedback">Feedback</label>
                                        </div>
                                    </div>

                                    <div class="col-md12 mb-3 divFeedback divPostponed" style="display:none">
                                        <div class="form-floating">
                                            <input maxlength="10" type="text" autocomplete="off" class="form-control txtFeedback myDatepicker" id="txtNewCourtDate">
                                            <label for="txtNewCourtDate">New Court Date</label>
                                        </div>
                                    </div>
                                    <div class="col-md12 mb-3 divFeedback divPaid" style="display:none">
                                        <div class="form-floating">
                                            <input maxlength="10" type="number" autocomplete="off" class="form-control txtFeedback" id="txtPaidAmount">
                                            <label for="txtPaidAmount">Paid Amount</label>
                                        </div>
                                    </div>
                                    <div class="col-md12 mb-3 divFeedback divPaid" style="display:none">
                                        <div class="form-floating">
                                            <input maxlength="10" type="text" autocomplete="off" class="form-control txtFeedback" id="txtReceiptNumber">
                                            <label for="txtReceiptNumber">Receipt Number</label>
                                        </div>
                                    </div>
                                    <div class="col-md12 mb-3 divFeedback divReduced" style="display:none">
                                        <div class="form-floating">
                                            <input maxlength="10" type="number" autocomplete="off" class="form-control txtFeedback" id="txtNewFineAmount">
                                            <label for="txtNewFineAmount">New Fine Amount</label>
                                        </div>
                                    </div>
                                    <div class="col-md12 mb-3 divFeedback divPostponed divReduced divRemarks" style="display:none">
                                        <div class="form-floating">
                                            <textarea class="form-control txtFeedback" id="txtRemarks" style="height: 70px" spellcheck="true"></textarea>
                                            <label for="txtRemarks">Remarks</label>
                                        </div>
                                    </div>
                                    <div class="col-md-12 d-flex justify-content-center" style="display:none">
                                        <a class="btn btn-outline-primary btn-sm clsSubmitted" id="btnSaveProceed">Save & Proceed</a>

                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-link-danger" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-outline-primary clsSubmitted" id="btnPrintRegister">Print</button>
                <button type="button" class="btn btn-primary shadow-2 clsSubmitted" id="btnSubmitResults">Submit</button>
            </div>
        </div>
    </div>
</div>





<div class="modal fade modal-animate" id="submitResultsModal" data-bs-backdrop="static" data-bs-keyboard="false"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Court Results</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
            </div>
            <div class="modal-body">


                <div class="m-2">
                    <div class="col-12">
                        <div class="d-flex justify-content-center row">

                            <div class="col-md12 mb-3">
                                <div class="form-floating p-r-15">
                                    <input type="text" autocomplete="off" class="form-control txtConfirm requiredResults" id="txtPublicProsecutor">
                                    <label for="txtPublicProsecutor">Public Prosecutor</label>
                                </div>
                            </div>
                            <div class="col-md12 mb-3">
                                <div class="form-floating p-r-15">
                                    <input type="text" autocomplete="off" class="form-control txtConfirm" id="txtPrecidingOfficer">
                                    <label for="txtPrecidingOfficer">Preciding Officer</label>
                                </div>
                            </div>
                            <div class="col-md12 mb-3">
                                <div class="form-floating p-r-15">
                                    <input type="text" autocomplete="off" class="form-control txtConfirm" id="txtCourtClerk">
                                    <label for="txtCourtClerk">Court Clerk</label>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-link-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-outline-primary shadow-2" id="btnConfirmSubmit">Submit</button>
            </div>
        </div>
    </div>
</div>
