<script src="/Scripts/Home/users.js"></script>

<div class="col-sm-12">
    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-end">
                <h5 class="mb-0"><b>User Management</b></h5>
                <button type="button" id="btnAddNew" class="btn btn-outline-primary btn-sm d-inline-flex pull-right">New User</button>
            </div>

        </div>
        <div class="card-body">
            <div class="dt-responsive">
                <table id="dom-jqry" class="table table-striped table-bordered nowrap">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Last Login</th>
                        <th>Status</th>
                        <th class="text-center clsAction">Action</th>
                    </tr>
                    </thead>
                    <tbody id="tblUser">


                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>


<div class="modal fade modal-animate" style="overflow-y:auto" id="addUserModal" tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" style="height:100%;margin-top:0px;margin-bottom:0px">
        <div class="modal-content">
            <div class="modal-header">
                <div class="stepwizard pb-0">
                    <div class="stepwizard-row setup-panel">
                        <div class="stepwizard-step col-xs-3">
                            <a href="#step-1" type="button" id="step1" class="btn border btn-primary btn-circle">1</a>
                            <p class="mb-1"><small>Personal Details</small></p>
                        </div>
                        <div class="stepwizard-step col-xs-3">
                            <a href="#step-2" type="button" id="step2" class="btn border btn-light btn-circle">2</a>
                            <p class="mb-1"><small>Addresses</small></p>
                        </div>

                    </div>
                </div>
            </div>
            <div class="modal-body" style="min-height:100px">


                <div class="col-md-12 mt-0">

                    <div class="container">

                        <form user="form">
                            <div class="panel panel-primary setup-content" id="step-1">

                                <div class="panel-body">
                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtEmailAddress" placeholder="" type="text" class="form-control text-uppercase triggers clsUser">
                                                <label for="txtEmailAddress">Email Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtIDNumber" placeholder="" type="text" class="form-control triggers clsUser" >
                                                <label for="txtIDNumber">ID Number</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <div class="form-floating">
                                                    <select class="form-control  clsUser requiredUser1" placeholder="" id="cboRoleName">
                                                        <option selected value="">Select</option>
                                                    </select>
                                                    <label for="cboRoleName">Role</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtCellphoneNumber" placeholder="" type="text" class="form-control text-uppercase clsUser requiredUser1">
                                                <label for="txtCellphoneNumber">Cellphone Number</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <select class="form-control clsUser requiredUser1" placeholder="" id="cboTitle">
                                                    <option disabled="disabled" selected value="">Select</option>
                                                    <option value="Mr">Mr</option>
                                                    <option value="Ms">Ms</option>
                                                    <option value="Mrs">Mrs</option>
                                                    <option value="Miss">Miss</option>
                                                </select>
                                                <label for="cboTitle">Title</label>
                                            </div>
                                        </div>


                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtFirstName" placeholder="" type="text" class="form-control text-uppercase clsUser requiredUser1">
                                                <label for="txtFirstName">First Name</label>
                                            </div>
                                        </div>


                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtLastName" placeholder="" type="text" class="form-control text-uppercase clsUser requiredUser1">
                                                <label for="txtLastName">Last Name</label>
                                            </div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating" style="display:none">
                                                <input id="txtInspectorNumber" placeholder="" type="number" class="form-control text-uppercase clsUser ">
                                                <label for="txtInspectorNumber">Inspector Number</label>
                                            </div>
                                        </div>



                                    </div>
                                </div>
                            </div>

                            <div class="panel panel-primary setup-content" id="step-2">
                                <div class="panel-body">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPhysicalAddress" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPhysicalAddress">Physical Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPostalAddress" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPostalAddress">Postal Address</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPhysicalSuburb" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPhysicalSuburb">Suburb</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPostalSuburb" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPostalSuburb">Suburb</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPhysicalCity" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPhysicalCity">City</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPostalCity" placeholder="" type="text" class="form-control text-uppercase clsUser ">
                                                <label for="txtPostalCity">City</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPhysicalCode" placeholder="" maxlength="4" type="number" class="form-control clsUser ">
                                                <label for="txtPhysicalCode">Code</label>
                                            </div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input id="txtPostalCode" placeholder="" maxlength="4" type="number" class="form-control clsUser">
                                                <label for="txtPostalCode">Code</label>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>


                </div>


            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="btnSubmitUser" class="btn btn-primary nextBtn shadow-2">Next</button>
            </div>
        </div>
    </div>
</div>
