

<div class="auth-main" xmlns:th="http://www.thymeleaf.org">

    <script src="/Scripts/Login/index.js"></script>

    <div class="auth-wrapper v3">
        <div class="auth-form" style="background:none">
            <div class="auth-header">
                <a href="#"><img src="/Content/assets/images/logo-dark.png" height="40" width="120"  alt="img"></a>
            </div>
            <div class="card center my-3">
                <div class="card-body">
                    <div class="d-flex justify-content-center mb-4">
                        <h3 class="mb-0 text-center">
                            <b class="">Login</b>
                            <p class="mb-0 mt-2 text-muted">Stims</p>
                        </h3>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Email Address</label>
                        <input id="txtUsername" type="email" class="form-control requiredLogin" placeholder="Email Address" value="">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Password</label>
                        <input id="txtPassword" type="password" class="form-control requiredLogin" placeholder="Password" value="">
                    </div>

                    <div class="d-grid mt-4" style="display:grid">
                        <a  id="btnSignIn" class="btn btn-primary">Login</a>
                    </div>

                    <div class="saprator mt-3">
                        <span>Or</span>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="d-flex justify-content-center">
                                <h6 class="text-secondary f-w-300"><a href="#!" id="btnForgot" class="link-primary">Forgot Password?</a></h6>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
            <div class="auth-footer row">
                <!-- <div class=""> -->
                <!-- </div> -->
            </div>
        </div>
    </div>
</div>
