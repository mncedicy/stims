<div class="col-sm-12">

    <!-- [ Main Content ] start -->
    <div class="card">
        <!-- [ sample-page ] start -->

            <div class="card">

                    <div class="d-flex justify-content-between align-items-end">

                </div>
                <div class="card-body">

                                <th>Officer</th>

<div class="modal fade modal-animate" id="createNoticeModal" tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="confirmModalTitle" class="modal-title text-capitalize">Create Notice</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
            </div>
            <div class="modal-body text-muted p-4 text-center pb-2">
                <div class="col-md-12">
                    <div class="mb-3">
                        <div class="form-floating">

                            <select class="form-control  requiredCreate" placeholder="" id="cboNoticeType">
                                <option data-notice="999999" value="10">341 Hand Written</option>
                                <option data-notice="999999" selected value="50">Section 56</option>
                                <option data-notice="9999" value="51">Section 56 By-law</option>
                            </select>
                            <label for="cboNoticeType">Notice Type</label>
                        </div>


                        <!-- /.input group -->
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="mb-3">
                        <div class="form-floating">

                            <input id="txtNoticeReference" placeholder="" type="text" class="form-control requiredCreate txtNoticeReference">
                            <label for="txtNoticeReference">Notice Reference</label>
                        </div>
                        <!-- /.input group -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="btnCreateNotice" class="btn btn-primary shadow-2">Create</button>
            </div>
        </div>
    </div>
</div>

     aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-body" style="min-height:435px">


                <div class="col-md-12 mt-3">

                    <div class="container">
                        <div class="stepwizard pb-3">
                            <div class="stepwizard-row setup-panel">
                                <div class="stepwizard-step col-xs-3">
                                    <a href="#step-1" type="button" id="step1" class="btn border btn-primary btn-circle">1</a>
                                    <p><small>Notice Details</small></p>
                                </div>
                                <div class="stepwizard-step col-xs-3">
                                    <a href="#step-2" type="button" id="step2" class="btn border btn-light btn-circle">2</a>
                                    <p><small>Driver/Vehicle</small></p>
                                </div>
                                <div id="divContact" class="stepwizard-step col-xs-3">
                                    <a href="#step-3" type="button" id="step3" class="btn border btn-light btn-circle">3</a>
                                    <p><small>Contact Details</small></p>
                                </div>
                            </div>
                        </div>

                                <div class="panel-body">
                                    <div class="row">

                                                    <select class="form-control  cleanField" disabled="disabled" placeholder="" id="cboNoticeType1">
                                                        <option data-notice="999999" value="10">341 Hand Written</option>

                                                        <option data-notice="9999" value="51">Section 56 By-law</option>
                                                    </select>
                                                    <label for="cboNoticeType1">Notice Type</label>
                                                </div>


                                                <!-- /.input group -->
                                            </div>
                                        </div>

                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <div class="form-floating">

                                                    <input id="txtNoticeReference1" disabled="disabled" placeholder="" type="text" class="form-control">
                                                    <label for="txtNoticeReference1">Notice Reference</label>
                                                </div>
                                                <!-- /.input group -->
                                            </div>
                                        </div>

                                                </div>
                                            </div>
                                        </div>

                                            <div class="mb-3">

                                                    <label for="txtOffenceDate">Offence Date</label>

                                                </div>
                                                <!-- /.input group -->
                                            </div>
                                        </div>
                                        <div class="col-md-6">

                                                        <option disabled="disabled" selected value="">Select</option>

                                                </div>
                                                <!-- /.input group -->
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <div class="form-floating">

                                                    <input id="txtCourtDate" maxlength="8" type="text" placeholder="" class="form-control requiredNotice requiredNotice1 myDatepicker">
                                                    <label for="txtCourtDate">Court Date</label>

                                                </div>
                                                <!-- /.input group -->

                                                <label for="txtOffenceLocationCode">Postal Code</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="panel panel-primary setup-content" id="step-2">

                                        </div>

                                                    <option value="Mrs">Mrs</option>
                                                    <option value="Miss">Miss</option>
                                                </select>
                                                <label for="cboTitle">Title</label>
                                            </div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <select class="form-control requiredNotice requiredNotice2" placeholder="" id="cboVehicleMake">

                                                </select>
                                                <label for="cboVehicleMake">Vehicle Make</label>

                                                </select>
                                                <label for="cboVehicleModel">Vehicle Model</label>

                                        </div>

                                    </div>
                                </div>

                                            <div class="form-floating">
                                                <input id="txtCity" placeholder="" type="text" class="form-control text-uppercase requiredNotice3 requiredNotice">
                                                <label for="txtCity">City</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3 cls341L">
                                            <div class="form-floating">
                                                <input id="txtPostalCode" placeholder="" maxlength="4" type="number" class="form-control requiredNotice3 text-uppercase requiredNotice">
                                                <label for="txtPostalCode">Postal Code</label>
